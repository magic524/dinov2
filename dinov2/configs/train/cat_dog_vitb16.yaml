# 猫狗数据集训练配置 - 使用ViT-B/16避免xformers问题

train:
  dataset_path: CustomImageFolder:split=TRAIN:root=/mnt/e/Datasets/DINO_datasets/cat_dog:extra=/mnt/e/Datasets/DINO_datasets/cat_dog
  batch_size_per_gpu: 16
  num_workers: 4
  OFFICIAL_EPOCH_LENGTH: 500  # 8000/16 = 500
  saveckp_freq: 5
  cache_dataset: true
  seed: 42
  centering: "centering"

student:
  arch: vit_base  # 使用base模型，patch_size=16更兼容
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  drop_path_uniform: true
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 0

teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.04
  warmup_teacher_temp_epochs: 3

dino:
  loss_weight: 1.0
  head_n_prototypes: 1024
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  separate_head: false
  head_n_prototypes: 1024
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048

optim:
  epochs: 20
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.001
  lr: 0.
  warmup_epochs: 2
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_scale:
  - 0.4
  - 1.0
  local_crops_number: 8  # patch16可以使用更多local crops
  local_crops_scale:
  - 0.05
  - 0.4
  global_crops_size: 224
  local_crops_size: 96  # 96是16的倍数

evaluation:
  eval_period_iterations: 2500

compute_precision:
  grad_scaler: true
  teacher:
    backbone:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
  student:
    backbone:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: NO_SHARD
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
